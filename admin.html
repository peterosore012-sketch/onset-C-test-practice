<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 text-slate-900">
<header class="bg-slate-900 text-white p-5"><div class="max-w-7xl mx-auto flex justify-between"><div><h1 class="text-2xl font-bold">Admin Dashboard</h1><p class="text-slate-300">onSET-style C-Test Practice</p></div><button id="logout" class="hidden bg-white/10 px-4 py-2 rounded">Sign out</button></div></header>
<main class="max-w-7xl mx-auto p-4">
<div id="status" class="bg-white border rounded-xl p-4 mb-5">Checking administrator access...</div>
<section id="dash" class="hidden">
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">
<div class="bg-white p-5 rounded-xl"><div class="text-sm text-slate-500">Results</div><b id="count" class="text-3xl">0</b></div>
<div class="bg-white p-5 rounded-xl"><div class="text-sm text-slate-500">Students</div><b id="students" class="text-3xl">0</b></div>
<div class="bg-white p-5 rounded-xl"><div class="text-sm text-slate-500">Average</div><b id="avg" class="text-3xl">—</b></div>
<div class="bg-white p-5 rounded-xl"><div class="text-sm text-slate-500">Top Level</div><b id="top" class="text-3xl">—</b></div>
</div>
<div class="bg-white p-4 rounded-xl mb-5 flex gap-3 flex-col md:flex-row">
<input id="search" class="border rounded-lg px-3 py-2 flex-1" placeholder="Search admission number or test ID">
<select id="level" class="border rounded-lg px-3 py-2"><option value="">All levels</option><option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option></select>
<button id="refresh" class="bg-slate-900 text-white rounded-lg px-5 py-2">Refresh</button>
</div>
<div class="bg-white rounded-xl overflow-x-auto">
<div class="p-5 border-b"><b>Student Test Results</b><p class="text-sm text-slate-500">Admin-only view.</p></div>
<table class="min-w-full text-sm"><thead class="bg-slate-50"><tr>
<th class="text-left p-3">Student ID</th><th class="text-left p-3">Admission No.</th><th class="text-left p-3">Date</th><th class="text-left p-3">Test</th><th class="text-left p-3">Score</th><th class="text-left p-3">%</th><th class="text-left p-3">Level</th><th class="text-left p-3">Time</th>
</tr></thead><tbody id="rows"></tbody></table><div id="empty" class="hidden p-8 text-center text-slate-500">No results found.</div>
</div></section></main>
<script>
const URL="https://ipaibiqyizinlqltubhy.supabase.co";
const KEY="sb_publishable_L6afADukPDl2_afsM2WbaA_rqgh5koM";
const sb=window.supabase.createClient(URL,KEY); let results=[];
const $=id=>document.getElementById(id);
function status(t,err=false){$("status").textContent=t;$("status").className="mb-5 rounded-xl border p-4 "+(err?"bg-red-50 text-red-700 border-red-200":"bg-white");}
async function start(){
 const {data:{user},error}=await sb.auth.getUser();
 if(error||!user){status("Please sign in on the main website first.",true);return;}
 const {data:p,error:pe}=await sb.from("profiles").select("full_name,email,role").eq("id",user.id).single();
 if(pe||!p||p.role!=="admin"){status("Access denied. Administrator account required.",true);return;}
 $("logout").classList.remove("hidden");$("dash").classList.remove("hidden");status("Administrator: "+(p.full_name||p.email));
 load();
}
async function load(){
 const {data,error}=await sb.from("test_results").select("user_id,admission_number,test_date,test_id,raw_score,max_score,percentage,level,time_seconds").order("test_date",{ascending:false});
 if(error){status("Could not load results: "+error.message,true);return;} results=data||[]; render();
}
function render(){
 const q=$("search").value.toLowerCase(), lev=$("level").value;
 const a=results.filter(r=>(!q||String(r.admission_number||"").toLowerCase().includes(q)||String(r.test_id||"").toLowerCase().includes(q))&&(!lev||r.level===lev));
 $("count").textContent=results.length;$("students").textContent=new Set(results.map(r=>r.user_id)).size;
 if(results.length){$("avg").textContent=Math.round(results.reduce((s,r)=>s+Number(r.percentage||0),0)/results.length)+"%";let c={};results.forEach(r=>c[r.level]=(c[r.level]||0)+1);$("top").textContent=Object.entries(c).sort((x,y)=>y[1]-x[1])[0]?.[0]||"—";}else{$("avg").textContent="—";$("top").textContent="—";}
 $("rows").innerHTML=a.map(r=>{let tm=r.time_seconds!=null?Math.floor(r.time_seconds/60)+"m "+r.time_seconds%60+"s":"—";return `<tr class="border-t"><td class="p-3">${String(r.user_id||"").slice(0,8)}</td><td class="p-3">${r.admission_number||"—"}</td><td class="p-3">${r.test_date?new Date(r.test_date).toLocaleDateString():"—"}</td><td class="p-3">${r.test_id||"—"}</td><td class="p-3">${r.raw_score??"—"}/${r.max_score??"—"}</td><td class="p-3">${r.percentage??"—"}%</td><td class="p-3 font-bold">${r.level||"—"}</td><td class="p-3">${tm}</td></tr>`}).join("");
 $("empty").classList.toggle("hidden",a.length>0);
}
$("search").oninput=render;$("level").onchange=render;$("refresh").onclick=load;$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};start();
</script></body></html>
